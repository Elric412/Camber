name: Detent Builder Temp

on:
  push:
    branches: [detent-builder-temp]

permissions:
  contents: read
  issues: write

jobs:
  archive-scope-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HANDOFF_ISSUE: "1"
    steps:
      - name: Create ephemeral handoff key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/handoff.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/handoff.pem" -pubout -out "$RUNNER_TEMP/handoff.pub"
          pub="$(base64 -w0 "$RUNNER_TEMP/handoff.pub")"
          gh api "repos/$GITHUB_REPOSITORY/issues/$HANDOFF_ISSUE/comments" -f body="PUBKEY:${GITHUB_RUN_ID}:${pub}" >/dev/null
      - name: Probe archive endpoints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cipher=""
          for _ in $(seq 1 100); do
            body="$(gh api "repos/$GITHUB_REPOSITORY/issues/$HANDOFF_ISSUE/comments" --jq ".[] | select(.body | startswith(\"CIPHERTEXT:${GITHUB_RUN_ID}:\")) | .body" | tail -n1 || true)"
            if [ -n "$body" ]; then cipher="${body#CIPHERTEXT:${GITHUB_RUN_ID}:}"; break; fi
            sleep 5
          done
          test -n "$cipher"
          printf '%s' "$cipher" | base64 -d > "$RUNNER_TEMP/cipher.bin"
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/handoff.pem" -in "$RUNNER_TEMP/cipher.bin" -out "$RUNNER_TEMP/secret.txt" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          signed="$(cat "$RUNNER_TEMP/secret.txt")"
          token="$(python3 -c 'import sys,urllib.parse; u=urllib.parse.urlparse(sys.argv[1]); print(urllib.parse.parse_qs(u.query).get("token",[""])[0])' "$signed")"
          first=fail; codeload=fail; archive=fail; apiarchive=fail; publictoken=fail
          if curl -fsSL "$signed" -o "$RUNNER_TEMP/one"; then first=ok; fi
          if [ -n "$token" ]; then
            if curl -fsSL --max-time 60 "https://codeload.github.com/Elric412/Detent/zip/refs/heads/release-installers?token=$token" -o "$RUNNER_TEMP/codeload.zip" && [ "$(stat -c %s "$RUNNER_TEMP/codeload.zip")" -gt 1000000 ]; then codeload=ok; fi
            if curl -fsSL --max-time 60 "https://github.com/Elric412/Detent/archive/refs/heads/release-installers.zip?token=$token" -o "$RUNNER_TEMP/archive.zip" && [ "$(stat -c %s "$RUNNER_TEMP/archive.zip")" -gt 1000000 ]; then archive=ok; fi
            if curl -fsSL --max-time 60 "https://api.github.com/repos/Elric412/Detent/zipball/release-installers?token=$token" -o "$RUNNER_TEMP/api.zip" && [ "$(stat -c %s "$RUNNER_TEMP/api.zip")" -gt 1000000 ]; then apiarchive=ok; fi
            if curl -fsSL -H "Authorization: token $token" "https://api.github.com/repos/Elric412/Detent/contents/package.json" -o "$RUNNER_TEMP/pubtok"; then publictoken=ok; fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$HANDOFF_ISSUE/comments" -f body="ARCHIVERESULT:${GITHUB_RUN_ID}:first=${first},codeload=${codeload},archive=${archive},apiarchive=${apiarchive},publictoken=${publictoken}" >/dev/null
