name: Detent Production Builder

on:
  push:
    branches: [detent-builder-temp]

permissions:
  contents: read

jobs:
  installers:
    name: Current Detent Windows + Ubuntu x64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENCODE_CHANNEL: prod
      DETENT_TOKEN: ${{ secrets.DETENT_TOKEN }}
    steps:
      - name: Require private Detent read token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DETENT_TOKEN:-}" || {
            echo 'DETENT_TOKEN repository secret is required (read-only Contents access to Elric412/Detent).'
            exit 78
          }

      - name: Clone exact Detent release branch
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone --depth=1 --branch release-installers \
            "https://x-access-token:${DETENT_TOKEN}@github.com/Elric412/Detent.git" detent
          cd detent
          test "$(git rev-parse HEAD)" = "1a088761cd6c6bd78c9efca97f2aa50d68ff3681"
          git remote set-url origin https://github.com/Elric412/Detent.git

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install Linux, Wine, and validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          ALSA=libasound2t64
          apt-cache show "$ALSA" >/dev/null 2>&1 || ALSA=libasound2
          sudo apt-get install -y --no-install-recommends \
            wine64 xvfb libgtk-3-0 libnss3 "$ALSA" libgbm1 libxss1 \
            libatk-bridge2.0-0 libdrm2 desktop-file-utils appstream file
          wine --version
          bun --version

      - name: Install frozen workspace and validate release configuration
        working-directory: detent
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd packages/desktop
          bun typecheck
          bun test electron-builder.config.test.ts
          cd ../core
          bun test test/resource-sources.test.ts

      - name: Build and inspect both production installers
        working-directory: detent/packages/desktop
        shell: bash
        run: bun run package:release:linux-host

      - name: Clean-install, launch, and uninstall Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find detent/packages/desktop/dist -maxdepth 1 -type f -name 'Detent-*-ubuntu-debian-x64.deb' -print -quit)"
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          sudo apt-get install -y "./$deb"
          dpkg-query -W -f='${Status}\n' detent | grep -q 'install ok installed'
          test -x /opt/Detent/detent
          test -x /opt/Detent/resources/opencode-cli
          test -f /opt/Detent/resources/resources/packs/catalog.json
          test -f /usr/share/applications/ai.opencode.desktop.desktop
          grep -q '^Name=Detent$' /usr/share/applications/ai.opencode.desktop.desktop
          desktop-file-validate /usr/share/applications/ai.opencode.desktop.desktop
          appstreamcli validate --no-net /usr/share/metainfo/ai.opencode.desktop.metainfo.xml
          set +e
          timeout 25s xvfb-run -a /opt/Detent/detent --no-sandbox --disable-gpu >/tmp/detent-linux-launch.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then cat /tmp/detent-linux-launch.log; exit "$rc"; fi
          if grep -Ei 'module did not self-register|cannot find module|ENOENT.*resources|failed to load.*node|sidecar.*error' /tmp/detent-linux-launch.log; then cat /tmp/detent-linux-launch.log; exit 1; fi
          catalog="$(find "$HOME/.config" "$HOME/.local" -type f -path '*/cli/*/resources/packs/catalog.json' -print -quit 2>/dev/null || true)"
          test -n "$catalog"
          stage_root="$(dirname "$(dirname "$(dirname "$catalog")")")"
          staged_cli="$stage_root/opencode-cli"
          test -x "$staged_cli"
          cd /tmp
          for kind in skill agent style; do
            json="$("$staged_cli" resource search --kind "$kind" --limit 1 --json)"
            test "$(printf '%s' "$json" | bun -e 'const x=JSON.parse(await Bun.stdin.text()); console.log(x.length)')" -ge 1
          done
          sudo apt-get remove -y detent
          test ! -e /opt/Detent/detent

      - name: Clean-install, launch, and uninstall Windows installer under Wine
        shell: bash
        env:
          WINEPREFIX: ${{ runner.temp }}/detent-wine
          WINEDEBUG: -all
        run: |
          set -euo pipefail
          installer="$(find detent/packages/desktop/dist -maxdepth 1 -type f -name 'Detent-*-windows-x64-setup.exe' -print -quit)"
          test -n "$installer"
          mkdir -p "$WINEPREFIX"
          wineboot -u
          xvfb-run -a wine "$installer" /S
          app="$(find "$WINEPREFIX/drive_c" -type f -iname 'Detent.exe' -print -quit)"
          test -n "$app"
          file "$app" | grep -Eqi 'PE32\+.*x86-64|PE32 executable.*x86-64'
          set +e
          timeout 25s xvfb-run -a wine "$app" --disable-gpu >/tmp/detent-windows-launch.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then cat /tmp/detent-windows-launch.log; exit "$rc"; fi
          uninstaller="$(find "$(dirname "$app")" -maxdepth 1 -type f -iname 'Uninstall*.exe' -print -quit)"
          test -n "$uninstaller"
          xvfb-run -a wine "$uninstaller" /S
          sleep 3
          test ! -e "$app"

      - name: Collect production deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp detent/packages/desktop/dist/Detent-*-windows-x64-setup.exe release-artifacts/
          cp detent/packages/desktop/dist/Detent-*-ubuntu-debian-x64.deb release-artifacts/
          cp detent/packages/desktop/dist/installer-validation.json release-artifacts/
          cd release-artifacts
          sha256sum *.exe *.deb | tee SHA256SUMS.txt
          stat -c '%n %s bytes' *.exe *.deb | tee SIZES.txt

      - name: Upload production installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: detent-production-installers-1a088761
          path: release-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
