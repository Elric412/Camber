name: Detent ephemeral bootstrap

on:
  push:
    branches: [detent-build-ephemeral]

permissions:
  contents: read

jobs:
  bootstrap-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Recover verified Detent runtime baseline
        shell: pwsh
        env:
          BASELINE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-da84-81f5-b5ef-a8e331d68283/raw?se=2026-09-08T14%3A16%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=453bb08b-8a66-53c7-9db4-4dd0e99d0238&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T02%3A55%3A40Z&ske=2026-09-09T02%3A55%3A40Z&sks=b&skv=2026-02-06&sig=lqo4fE%2Bxo6D0VCu6t2v2U9yl6GW1WiTE7GNFUwunkL0%3D'
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'detent-pr158.zip'
          $artifact = Join-Path $env:RUNNER_TEMP 'detent-artifact'
          $install = Join-Path $env:RUNNER_TEMP 'Detent Baseline Ω'
          Invoke-WebRequest -Uri $env:BASELINE_URL -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $artifact -Force
          Write-Host 'Artifact files:'
          Get-ChildItem -LiteralPath $artifact -Recurse | ForEach-Object { Write-Host $_.FullName }
          $installer = Get-ChildItem -LiteralPath $artifact -Filter '*.exe' -Recurse | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          if ($null -eq $installer) { throw 'baseline installer not found' }
          $p = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$install") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "baseline install failed: $($p.ExitCode)" }
          $version = '0.1.0'
          $python = Join-Path $install "versions\$version\runtime\python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "private runtime missing: $python" }
          & $python -I -B -X utf8 -c "import detent,sys; print(detent.__version__); print(detent.__file__); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { throw 'private runtime probe failed' }
          $root = Join-Path $install "versions\$version"
          foreach ($required in @('runtime','skills','agents','style-library','design-system-library','ui-components-library','assets','harness','detent.yaml')) {
            $candidate = Join-Path $root $required
            if (-not (Test-Path -LiteralPath $candidate)) { throw "baseline resource missing: $required" }
          }
          Write-Host "DETENT_BASELINE_ROOT=$root"
          Write-Host 'Detent verified baseline recovered successfully.'
